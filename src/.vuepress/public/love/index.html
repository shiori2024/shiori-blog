<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>我喜欢你</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(160deg, #0a0a2e 0%, #131038 45%, #1a0a2e 100%);
    overflow-x: hidden;
    overflow-y: auto;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  body::-webkit-scrollbar { width: 0; height: 0; }

  /* ---------- 极光 ---------- */
  .aurora {
    position: fixed; inset: -30%; z-index: 0;
    pointer-events: none; filter: blur(70px);
  }
  .aurora i {
    position: absolute; border-radius: 50%;
    mix-blend-mode: screen; opacity: .5;
  }
  .aurora i:nth-child(1) {
    width: 60vmax; height: 60vmax; left: -10%; top: -20%;
    background: radial-gradient(circle, rgba(255, 77, 109, .55), transparent 65%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(2) {
    width: 50vmax; height: 50vmax; right: -15%; top: -10%;
    background: radial-gradient(circle, rgba(122, 59, 255, .5), transparent 65%);
    animation: drift2 32s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(3) {
    width: 45vmax; height: 45vmax; left: 25%; bottom: -25%;
    background: radial-gradient(circle, rgba(46, 139, 255, .45), transparent 65%);
    animation: drift3 38s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    0%   { transform: translate(-8%, -4%) scale(1); }
    100% { transform: translate(14%, 10%) scale(1.25); }
  }
  @keyframes drift2 {
    0%   { transform: translate(6%, 4%) scale(1.15); }
    100% { transform: translate(-12%, -8%) scale(.95); }
  }
  @keyframes drift3 {
    0%   { transform: translate(0, 6%) scale(1); }
    100% { transform: translate(10%, -12%) scale(1.3); }
  }

  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 45%, rgba(4, 2, 20, .55) 100%);
  }

  canvas#fx {
    position: fixed; inset: 0; z-index: 4;
    pointer-events: none;
  }

  /* ---------- 漂浮爱心 / 花瓣 / 萤火虫 ---------- */
  .floatLayer { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .float-heart {
    position: absolute; bottom: -70px;
    animation: rise linear forwards;
    opacity: 0;
    filter: drop-shadow(0 0 6px rgba(255, 90, 130, .6));
    user-select: none;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(.3) rotate(-10deg); opacity: 0; }
    12%  { opacity: .95; }
    100% { transform: translateY(calc(-105vh)) scale(1.2) rotate(12deg); opacity: 0; }
  }

  .rain-heart {
    position: absolute; top: -60px;
    animation: fall linear forwards;
    filter: drop-shadow(0 0 8px rgba(255, 90, 130, .7));
    user-select: none;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    100% { transform: translateY(calc(105vh + 90px)) rotate(340deg); opacity: .9; }
  }

  .pop-heart {
    position: absolute; top: 50%; left: 50%;
    animation: popHeart 3.2s ease-in-out forwards;
    filter: drop-shadow(0 0 24px rgba(255, 80, 120, .85));
    user-select: none; pointer-events: none;
  }
  @keyframes popHeart {
    0%   { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
    14%  { transform: translate(-50%, -50%) scale(1.3) rotate(25deg); opacity: 1; }
    30%  { transform: translate(-50%, -50%) scale(1) rotate(-18deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(.35) rotate(680deg); opacity: 0; }
  }

  .petal {
    position: absolute; top: -40px;
    animation: petalFall linear infinite;
    opacity: 0; pointer-events: none; user-select: none;
    filter: drop-shadow(0 0 4px rgba(255, 150, 160, .5));
  }
  @keyframes petalFall {
    0%   { transform: translateY(-40px) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .8; }
    50%  { transform: translateY(48vh) translateX(46px) rotate(200deg); opacity: .7; }
    100% { transform: translateY(112vh) translateX(-46px) rotate(380deg); opacity: 0; }
  }

  .firefly {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle, #fff8 0%, #ffe9c9 45%, transparent 70%);
    box-shadow: 0 0 10px 3px rgba(255, 230, 180, .55);
    animation: flyy linear infinite;
    opacity: 0; pointer-events: none;
  }
  @keyframes flyy {
    0%, 100% { transform: translate(0, 0) scale(.7); opacity: .1; }
    25% { opacity: .95; }
    50% { transform: translate(38px, -70px) scale(1.1); opacity: .45; }
    75% { transform: translate(-30px, -30px) scale(.9); opacity: .85; }
  }

  /* ============ 手写情书卡片 ============ */
  .content {
    position: fixed; left: 0; right: 0; top: 47%;
    transform: translateY(-52%);
    display: flex; flex-direction: column; align-items: center;
    gap: 22px; z-index: 10; text-align: center; padding: 0 14px;
    pointer-events: none;
  }

  .paper-card {
    position: relative;
    opacity: 0;
    pointer-events: none;
    transition: opacity .8s ease;
    z-index: 11;
  }
  .paper-card.enter { opacity: 1; }

  #titleSvg {
    display: block;
    width: min(88vw, 720px);
    height: auto;
    overflow: visible;
  }
  .h-stroke {
    fill: none;
    stroke: #e74c6e;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
  }
  .h-stroke.visible { opacity: 1; }
  .h-ink {
    fill: #e74c6e;
    opacity: 0;
    filter: blur(7px);
    transition: opacity .8s ease, filter 1.1s ease;
  }
  .h-char.inked .h-ink { opacity: 1; filter: blur(0); }
  #titleSvg.writing { animation: handshake 1.3s linear infinite; }
  @keyframes handshake {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(1.5px, -1px); }
    50%  { transform: translate(-1px, 1px); }
    75%  { transform: translate(1px, 1.5px); }
    100% { transform: translate(0, 0); }
  }
  #titleSvg.done { filter: drop-shadow(0 5px 8px rgba(120, 20, 60, .4)); }
  #pen { opacity: 0; transition: opacity .6s ease; }

  .title-fallback {
    display: none;
    font-family: "Ma Shan Zheng", "STKaiti", "KaiTi", cursive;
    font-size: clamp(34px, 7vw, 62px);
    color: #e74c6e;
    text-shadow: 0 3px 8px rgba(120, 20, 60, .4);
    letter-spacing: 4px;
  }

  #rainBtn {
    margin-top: 4px; pointer-events: auto; cursor: pointer;
    padding: 12px 30px; border-radius: 999px;
    border: 1px solid rgba(255, 143, 171, .55);
    background: rgba(255, 77, 109, .16);
    color: #ffd6e0; font-size: 16px; letter-spacing: 2px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 0 22px rgba(255, 77, 109, .35), inset 0 0 12px rgba(255, 120, 150, .12);
    opacity: 0; transform: translateY(14px);
    transition: all .5s ease, box-shadow .3s;
    animation: btnGlow 2s ease-in-out infinite;
    user-select: none;
  }
  #rainBtn.show { opacity: 1; transform: translateY(0); }
  #rainBtn:hover {
    background: rgba(255, 77, 109, .45);
    transform: scale(1.08); box-shadow: 0 0 40px rgba(255, 77, 109, .75);
  }
  @keyframes btnGlow {
    0%, 100% { box-shadow: 0 0 18px rgba(255, 77, 109, .3), inset 0 0 12px rgba(255, 120, 150, .1); }
    50%      { box-shadow: 0 0 34px rgba(255, 77, 109, .6), inset 0 0 12px rgba(255, 120, 150, .18); }
  }

  .footer {
    position: fixed; left: 0; right: 0; bottom: 16px; z-index: 10;
    text-align: center; color: rgba(255, 179, 193, .65);
    font-size: 13px; letter-spacing: 1.5px; pointer-events: none;
    text-shadow: 0 0 8px rgba(255, 120, 150, .35);
  }

  /* ---------- 加载页 ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 40%, #1a0a3e, #0a0a2e);
    transition: opacity .8s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .heart-loader { font-size: 46px; animation: loadPulse 1s ease-in-out infinite; }
  #loading .dots { font-size: 20px; color: #ffb3c1; letter-spacing: 3px; }
  #loading .dots::after { content: ''; animation: dotAnim 1.5s steps(1, end) infinite; }
  @keyframes loadPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }
  @keyframes dotAnim {
    0%   { content: ''; }
    33%  { content: '.'; }
    66%  { content: '..'; }
    100% { content: '...'; }
  }

  .spacer { height: 180vh; width: 100%; pointer-events: none; }
</style>
</head>
<body>

<div class="aurora"><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>
<div class="vignette"></div>
<div class="floatLayer" id="floatLayer"></div>

<div class="content">
  <div class="paper-card" id="paperCard">
    <svg id="titleSvg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="penGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e74c6e" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#e74c6e" stop-opacity="0"/>
        </radialGradient>
      </defs>
    </svg>
    <h1 class="title-fallback" id="titleFallback"></h1>
  </div>
  <button id="rainBtn">点我 💘</button>
</div>

<p class="footer">Made with <span style="color:#ff4d6d">❤</span> for You</p>

<div id="loading">
  <div class="heart-loader">💗</div>
  <div class="dots">正在准备惊喜</div>
</div>

<div class="spacer"></div>

  /* ============ DOM 引用 ============ */
  var canvas = document.getElementById("fx");
  var ctx = canvas.getContext("2d");
  var floatLayer = document.getElementById("floatLayer");
  var rainBtn = document.getElementById("rainBtn");
  var loading = document.getElementById("loading");
  var paperCard = document.getElementById("paperCard");
  var titleSvg = document.getElementById("titleSvg");
  var titleFallback = document.getElementById("titleFallback");

  var W = 0, H = 0, DPR = 1;

  /* ============ 爱心粒子精灵图 ============ */
  var HEART_COLORS = ["#ff4d6d", "#ff5e7a", "#ff8fa8", "#e0569b", "#ff6b9d", "#f472b6", "#ffb3c1"];
  var sprites = [];

  function makeSprite(color) {
    var s = document.createElement("canvas");
    s.width = s.height = 64;
    var c = s.getContext("2d");
    var g = c.createRadialGradient(32, 32, 2, 32, 32, 30);
    g.addColorStop(0, "rgba(255,120,160,.5)");
    g.addColorStop(0.4, "rgba(255,90,130,.18)");
    g.addColorStop(1, "rgba(255,0,0,0)");
    c.fillStyle = g;
    c.fillRect(0, 0, 64, 64);
    var hg = c.createLinearGradient(16, 12, 48, 52);
    hg.addColorStop(0, "#ffdbe6");
    hg.addColorStop(0.45, color);
    hg.addColorStop(1, "#c9184a");
    c.fillStyle = hg;
    c.beginPath();
    c.arc(24, 22, 10, 0, Math.PI * 2);
    c.arc(40, 22, 10, 0, Math.PI * 2);
    c.moveTo(16, 27);
    c.lineTo(32, 50);
    c.lineTo(48, 27);
    c.closePath();
    c.fill();
    return s;
  }

  HEART_COLORS.forEach(function (c) { sprites.push(makeSprite(c)); });

  function drawHeart(x, y, size, idx, alpha) {
    var spr = sprites[idx % sprites.length];
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.drawImage(spr, x - size / 2, y - size / 2, size, size);
    ctx.globalAlpha = 1;
  }

  /* ============ 星星 ============ */
  var stars = [];
  function initStars() {
    stars = [];
    var n = Math.floor((W * H) / 9000);
    if (n < 60) n = 60;
    if (n > 170) n = 170;
    for (var i = 0; i < n; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.4, ph: Math.random() * Math.PI * 2, sp: 0.5 + Math.random() * 1.5 });
    }
  }

  /* ============ 主漂浮发光爱心 (⑦) ============ */
  var floaters = [];
  function initFloaters() {
    floaters = [];
    for (var i = 0; i < 55; i++) {
      floaters.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
        size: 7 + Math.random() * 11, col: Math.floor(Math.random() * sprites.length),
        wob: Math.random() * Math.PI * 2, wobSp: 0.5 + Math.random() * 1.2
      });
    }
  }

  /* ============ 中心大爱心（粒子汇聚） ============ */
  var heartParts = [];
  var heartScale = 100, heartCx = 0, heartCy = 0;

  function heartShape(t) {
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: x, y: -y };
  }

  function initHeart() {
    heartScale = (Math.min(W, H) * 0.36) / 32;
    heartCx = W / 2;
    heartCy = H * 0.66;
    heartParts = [];
    for (var i = 0; i < 82; i++) {
      var t = (i / 82) * Math.PI * 2;
      var p = heartShape(t);
      heartParts.push({
        x: heartCx + (Math.random() - 0.5) * W * 0.8, y: heartCy + (Math.random() - 0.5) * H * 0.6,
        tx: p.x * heartScale, ty: p.y * heartScale,
        size: 5 + Math.random() * 7, col: Math.floor(Math.random() * sprites.length)
      });
    }
  }

  /* ============ 拖尾 & 爆炸 粒子池 ============ */
  var bursts = [];
  function burst(x, y, count, spread, sizeMin, sizeMax) {
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = (Math.random() * spread) + spread * 0.25;
      bursts.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - (Math.random() * 1.2),
        life: 0, max: 60 + Math.random() * 40,
        size: sizeMin + Math.random() * (sizeMax - sizeMin), col: Math.floor(Math.random() * sprites.length)
      });
    }
  }

  /* ============ 响应式 ============ */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initStars();
    initFloaters();
    initHeart();
  }
  window.addEventListener("resize", resize);

  /* ============ 主循环 ============ */
  var now = Date.now();
  function loop() {
    var t = Date.now();
    now = t;
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = 0.25 + 0.75 * Math.abs(Math.sin(t / 1000 * s.sp + s.ph));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      f.wob += f.wobSp * 0.01;
      f.x += f.vx + Math.sin(f.wob) * 0.15;
      f.y += f.vy + Math.cos(f.wob * 0.8) * 0.1;
      if (f.x < -30) f.x = W + 30; if (f.x > W + 30) f.x = -30;
      if (f.y < -30) f.y = H + 30; if (f.y > H + 30) f.y = -30;
      var tw = 0.55 + 0.45 * Math.sin(t / 500 + f.wob * 2);
      drawHeart(f.x, f.y, f.size * (0.85 + tw * 0.35), f.col, 0.5 + 0.5 * tw);
    }

    var breath = 1 + 0.035 * Math.sin(t / 700);
    for (i = 0; i < heartParts.length; i++) {
      var p = heartParts[i];
      var gx = heartCx + p.tx * breath;
      var gy = heartCy + p.ty * breath;
      p.x += (gx - p.x) * 0.055;
      p.y += (gy - p.y) * 0.055;
      drawHeart(p.x, p.y, p.size, p.col, 0.85);
    }

    for (i = bursts.length - 1; i >= 0; i--) {
      var b = bursts[i];
      b.life++;
      b.x += b.vx;
      b.y += b.vy;
      b.vy += 0.05;
      b.vx *= 0.985;
      var lifeRatio = 1 - b.life / b.max;
      if (lifeRatio <= 0) { bursts.splice(i, 1); continue; }
      drawHeart(b.x, b.y, b.size * (0.6 + 0.4 * lifeRatio), b.col, lifeRatio * 0.9);
    }

    requestAnimationFrame(loop);
  }

  /* ============ 鼠标拖尾 (②) ============ */
  var lastTrail = 0;
  window.addEventListener("pointermove", function (e) {
    var p = Date.now();
    if (p - lastTrail < 40) return;
    lastTrail = p;
    burst(e.clientX, e.clientY, 2, 1.4, 8, 16);
  }, { passive: true });

  /* ============ 点击爆炸 (③) ============ */
  window.addEventListener("pointerdown", function (e) {
    burst(e.clientX, e.clientY, 26, 4.5, 8, 18);
  }, { passive: true });

  /* ============ 滚动爱心轨迹 (彩蛋) ============ */
  var lastScrollY = window.scrollY;
  var userInteracted = false;
  window.addEventListener("pointerdown", function () { userInteracted = true; }, { passive: true });
  window.addEventListener("wheel", function () { userInteracted = true; }, { passive: true });

  window.addEventListener("scroll", function () {
    var y = window.scrollY;
    var delta = y - lastScrollY;
    lastScrollY = y;
    if (Math.abs(delta) < 2) return;
    var n = Math.min(6, Math.floor(Math.abs(delta) / 14) + 1);
    for (var i = 0; i < n; i++) {
      burst(W * 0.1 + Math.random() * W * 0.8, H * 0.25 + Math.random() * H * 0.55, 1, 1.2, 8, 16);
    }
  }, { passive: true });

  function startAutoScroll() {
    var max = document.body.scrollHeight - window.innerHeight;
    var dir = 1;
    setInterval(function () {
      if (userInteracted) return;
      var y = window.scrollY;
      if (dir === 1 && y >= max) dir = -1;
      if (dir === -1 && y <= 0) dir = 1;
      window.scrollBy(0, dir * 1.2);
    }, 50);
  }

  /* ============ 漂浮爱心 ①⑤ ============ */
  var HEART_EMOJI = ["❤️", "💗", "💖", "💕", "💘", "💝", "💜", "🩷", "💗"];

  function spawnFloatHeart() {
    if (floatLayer.childElementCount > 26) return;
    var el = document.createElement("div");
    el.className = "float-heart";
    el.textContent = HEART_EMOJI[Math.floor(Math.random() * HEART_EMOJI.length)];
    var size = 13 + Math.random() * 24;
    var corner = Math.random() < 0.35;
    el.style.left = (corner ? (Math.random() < 0.5 ? -16 : W + 16) : Math.random() * W) + "px";
    el.style.fontSize = size + "px";
    el.style.animationDuration = (5 + Math.random() * 4) + "s";
    floatLayer.appendChild(el);
    setTimeout(function () { el.remove(); }, 10000);
  }
  setInterval(spawnFloatHeart, 620);

  /* ============ 偶尔弹出大爱心 (⑥) ============ */
  function popBigHeart() {
    var el = document.createElement("div");
    el.className = "pop-heart";
    el.textContent = HEART_EMOJI[Math.floor(Math.random() * HEART_EMOJI.length)];
    el.style.fontSize = (72 + Math.random() * 58) + "px";
    floatLayer.appendChild(el);
    setTimeout(function () { el.remove(); }, 3400);
  }
  setTimeout(function () {
    setInterval(popBigHeart, 7000);
    popBigHeart();
  }, 3500);

  /* ============ 爱心雨 (彩蛋) ============ */
  function heartRain() {
    burst(W / 2, H / 2, 60, 6, 10, 20);
    for (var i = 0; i < 70; i++) {
      var el = document.createElement("div");
      el.className = "rain-heart";
      el.textContent = HEART_EMOJI[Math.floor(Math.random() * HEART_EMOJI.length)];
      el.style.left = (Math.random() * 100) + "vw";
      el.style.fontSize = (12 + Math.random() * 30) + "px";
      el.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";
      el.style.animationDelay = (Math.random() * 1.6) + "s";
      floatLayer.appendChild(el);
      setTimeout(function (x) { x.remove(); }, 6500, el);
    }
  }
  rainBtn.addEventListener("click", heartRain);

  /* ============ 花瓣 / 萤火虫 ============ */
  var PETALS = ["🌸", "🌹", "🌸", "💮", "✿"];
  for (var i = 0; i < 12; i++) {
    var pt = document.createElement("div");
    pt.className = "petal";
    pt.textContent = PETALS[i % PETALS.length];
    pt.style.left = (Math.random() * 100) + "vw";
    pt.style.fontSize = (10 + Math.random() * 16) + "px";
    pt.style.animationDuration = (8 + Math.random() * 9) + "s";
    pt.style.animationDelay = (Math.random() * 9) + "s";
    floatLayer.appendChild(pt);
  }
  for (var f = 0; f < 10; f++) {
    var ff = document.createElement("div");
    ff.className = "firefly";
    ff.style.left = (Math.random() * 100) + "vw";
    ff.style.top = (Math.random() * 90) + "vh";
    ff.style.animationDuration = (4 + Math.random() * 5) + "s";
    ff.style.animationDelay = (Math.random() * 6) + "s";
    floatLayer.appendChild(ff);
  }

  /* ==================================================================
     手绘文字：SVG path + stroke-dashoffset 一笔一划书写
     ================================================================== */
  var SVG_NS = "http://www.w3.org/2000/svg";
  var SPACING = 64;       // 字间距
  var PAD_X = 90, PAD_TOP = 150, PAD_BOT = 120, ROW_GAP = 70;
  var STROKE_W = 30;      // 笔迹宽度（单位）
  var WRITE_SECONDS = 5.2; // 总书写时长

  var penG, penCore, writingActive = false;
  var strokeJobs = [];    // {path, len, start, dur, chIdx, charEl}
  var writeStart = 0, totalEnd = 0;
  var charData = null;

  function buildTitle() {
    try {
      var asc = FONT_DATA.ascender, desc = FONT_DATA.descender;
      var chars = FONT_DATA.chars;

      /* 单行/双行布局：4 字以内一行，更多则分两行 */
      var row1, row2;
      if (chars.length <= 5) {
        row1 = chars;
        row2 = [];
      } else {
        var mid = Math.ceil(chars.length / 2);
        row1 = chars.slice(0, mid);
        row2 = chars.slice(mid);
      }
      function rowWidth(row) {
        var w = 0;
        for (var i = 0; i < row.length; i++) w += row[i].adv;
        return w + (row.length - 1) * SPACING;
      }
      var w1 = rowWidth(row1), w2 = row2.length ? rowWidth(row2) : 0;
      var totalW = Math.max(w1, w2) + PAD_X * 2;
      var rowH = asc - desc;
      var row1Base = PAD_TOP + asc;
      var row2Base = row1Base + rowH + ROW_GAP;
      var totalH = (row2.length ? row2Base - desc : row1Base - desc) + PAD_BOT;

      titleSvg.setAttribute("viewBox", "0 0 " + totalW + " " + totalH);

      /* 笔尖 */
      penG = document.createElementNS(SVG_NS, "g");
      penG.id = "pen";
      penG.setAttribute("transform", "translate(" + PAD_X + "," + row1Base + ")");
      var glow = document.createElementNS(SVG_NS, "circle");
      glow.setAttribute("r", "34");
      glow.setAttribute("fill", "url(#penGrad)");
      penCore = document.createElementNS(SVG_NS, "circle");
      penCore.setAttribute("r", "9");
      penCore.setAttribute("fill", "#c0392b");
      penG.appendChild(glow);
      penG.appendChild(penCore);
      titleSvg.appendChild(penG);

      charData = [];
      var chars = FONT_DATA.chars;

      function addRow(row, base) {
        var cx = PAD_X;
        for (var i = 0; i < row.length; i++) {
          var cd = row[i];
          var idx = chars.indexOf(cd);
          var g = document.createElementNS(SVG_NS, "g");
          g.setAttribute("class", "h-char");
          var jx = (Math.random() - 0.5) * 20;
          var jy = (Math.random() - 0.5) * 20 - 4;
          g.setAttribute("transform", "translate(" + cx + "," + base + ") translate(" + jx.toFixed(1) + "," + jy.toFixed(1) + ")");

          /* 墨迹填充层（写完后墨迹晕开） */
          var ink = document.createElementNS(SVG_NS, "path");
          ink.setAttribute("class", "h-ink");
          ink.setAttribute("d", cd.contours.join(" "));
          g.appendChild(ink);

          /* 逐笔画描边层 */
          for (var k = 0; k < cd.contours.length; k++) {
            var sp = document.createElementNS(SVG_NS, "path");
            sp.setAttribute("class", "h-stroke");
            sp.setAttribute("d", cd.contours[k]);
            sp.setAttribute("stroke-width", STROKE_W);
            var rx = (Math.random() - 0.5) * 12;
            var ry = (Math.random() - 0.5) * 12;
            sp.setAttribute("transform", "translate(" + rx.toFixed(1) + "," + ry.toFixed(1) + ")");
            g.appendChild(sp);
          }
          titleSvg.appendChild(g);
          charData.push({ el: g, ink: ink, cd: cd });
          cx += cd.adv + SPACING;
        }
      }
      addRow(row1, row1Base);
      if (row2.length) addRow(row2, row2Base);

      /* 收集笔画并计算长度 */
      var totalLen = 0;
      for (var ci = 0; ci < charData.length; ci++) {
        var strokes = charData[ci].el.querySelectorAll(".h-stroke");
        for (var si = 0; si < strokes.length; si++) {
          var len = strokes[si].getTotalLength();
          strokes[si].style.strokeDasharray = len;
          strokes[si].style.strokeDashoffset = len;
          strokeJobs.push({ path: strokes[si], len: len, chIdx: ci });
          totalLen += len;
        }
      }

      /* 分配时间：先字符后笔画，时长与长度成正比 */
      var charGap = 0.2;
      var t = 0;
      for (ci = 0; ci < charData.length; ci++) {
        var charStart = t;
        t += charGap;
        var charLen = 0;
        for (si = 0; si < strokeJobs.length; si++) {
          if (strokeJobs[si].chIdx === ci) charLen += strokeJobs[si].len;
        }
        var charTime = 0.28 + (charLen / totalLen) * WRITE_SECONDS;
        var acc = 0;
        for (si = 0; si < strokeJobs.length; si++) {
          var job = strokeJobs[si];
          if (job.chIdx !== ci) continue;
          var d = (job.len / charLen) * charTime;
          job.start = charStart + acc;
          job.dur = d;
          acc += d;
        }
        t = charStart + charTime;
      }
      totalEnd = t + 0.3;
      return true;
    } catch (e) {
      return false;
    }
  }

  function startWriting() {
    titleSvg.classList.add("writing");
    penG.style.opacity = "1";
    penG.style.transition = "opacity .6s ease";
    writingActive = true;
    writeStart = performance.now() / 1000;
    var charDone = [];

    function toSvgPoint(path, x, y) {
      var m = titleSvg.getScreenCTM().inverse().multiply(path.getScreenCTM());
      return { x: m.a * x + m.c * y + m.e, y: m.b * x + m.d * y + m.f };
    }

    function frame() {
      var cur = performance.now() / 1000 - writeStart;
      var active = null;
      for (var i = 0; i < strokeJobs.length; i++) {
        var job = strokeJobs[i];
        var p = (cur - job.start) / job.dur;
        if (p <= 0) continue;
        if (p < 1) {
          job.path.style.strokeDashoffset = (1 - p) * job.len;
          job.path.classList.add("visible");
          if (active === null) active = job;
          else if (job.start > active.start) active = job;
        } else {
          job.path.style.strokeDashoffset = 0;
          job.path.classList.add("visible");
          if (charDone[job.chIdx] === undefined && job.start + job.dur <= cur) {
            charDone[job.chIdx] = true;
            charData[job.chIdx].el.classList.add("inked");
          }
        }
      }
      if (active) {
        var ap = (cur - active.start) / active.dur;
        var raw = active.path.getPointAtLength(Math.min(1, ap) * active.len);
        var pos = toSvgPoint(active.path, raw.x, raw.y);
        var j1 = (Math.random() - 0.5) * 3;
        var j2 = (Math.random() - 0.5) * 3;
        penG.setAttribute("transform", "translate(" + (pos.x + j1) + "," + (pos.y + j2) + ")");
      }
      if (cur >= totalEnd) {
        writingActive = false;
        titleSvg.classList.remove("writing");
        titleSvg.classList.add("done");
        penG.style.opacity = "0";
        rainBtn.classList.add("show");
        return;
      }
      requestAnimationFrame(frame);
    }
    frame();
  }

  /* ============ 开场：加载 -> 卡片入场 -> 手写揭晓 ============ */
  resize();
  loop();
  startAutoScroll();

  setTimeout(function () {
    loading.classList.add("done");
    setTimeout(function () { loading.style.display = "none"; }, 900);
    burst(W / 2, H * 0.5, 70, 7, 10, 22);

    paperCard.classList.add("enter");
    setTimeout(function () {
      if (!buildTitle()) {
        titleFallback.style.display = "block";
        titleFallback.textContent = TITLE_TEXT;
        rainBtn.classList.add("show");
        return;
      }
      setTimeout(startWriting, 500);
    }, 700);
  }, 1900);
})();
</script>
</body>
</html>
